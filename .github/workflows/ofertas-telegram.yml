name: ofertas-telegram

on:
  schedule:
    - cron: "7 * * * *"   # cada hora, al minuto 7 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ofertas-telegram
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4

      - name: Leer canales y enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python ofertas-telegram/scraper.py

      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "ofertas-telegram[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas-telegram/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "ofertas-telegram: $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
